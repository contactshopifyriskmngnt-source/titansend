    // TitanSend Analytics Integration
    async function logEmailToAnalytics(email, subject, campaignId) {
      try {
        // Only log if TitanLogger is available
        if (typeof TitanLogger !== 'undefined') {
          const result = await TitanLogger.logEmail({
            email: email,
            subject: subject,
            campaignId: campaignId || 'titansend_default',
            userId: 'titansend_user',
            personalizationData: {
              timestamp: new Date().toISOString(),
              sentFrom: 'titansend_web_app'
            }
          });
          if (result && result.success) {
            console.log('📊 Analytics logged:', result.logId);
            addLiveActivity(`📊 Analytics: ${email}`);
          }
        }
      } catch (error) {
        console.warn('⚠️ Analytics logging error:', error.message);
      }
    }
